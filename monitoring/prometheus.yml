global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'codelab-core-service'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'codelab-core-service'
    static_configs:
      - targets: ['codelab-core-service:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'qdrant'
    static_configs:
      - targets: ['codelab-qdrant:6333']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
